# Runs on every push and pull request. A red X on a commit means something broke.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Python lint (ruff)
        run: ruff check .
      - name: Python solver self-test (KineSolver comparison and physics checks)
        run: python3 susp_solver.py selftest
      - name: Hand-calculation checks (exact answers)
        run: python3 tests/test_analytic.py
      - name: Input handling (typed errors, misspelled targets)
        run: python3 tests/test_config.py
      - name: Reference cases (validation/) - hand statics, 2D four-bar curves every 5 mm
        run: |
          python3 validation/tools/planar_fourbar.py | diff - validation/planar_fourbar.json
          python3 validation/tools/handcalc_loads.py | diff - validation/loads_handcalc.json
          python3 tests/test_reference.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Build the web page (and check the committed copy is up to date)
        run: |
          python3 ui/build.py
          git diff --exit-code ui/index.html || (echo "ui/index.html is out of date: run python3 ui/build.py and commit it" && exit 1)
      - name: Browser solver matches the Python solver
        run: python3 ui/test_port.py
      - name: Randomized parity, 200 perturbed designs (Python vs browser)
        run: python3 tests/test_parity.py
      - name: CAD export reads back in a CAD kernel (OpenCascade)
        run: python3 tests/test_cad.py
      - name: Install browser test tools
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: JavaScript lint (ESLint)
        working-directory: tests
        run: |
          node lint_bundle.js
          npx eslint .
          npx prettier --config ../.prettierrc.json --check "../ui/src/*.js" "../ui/solver/*.js" ../ui/cad.js
      - name: Web app end-to-end checks
        run: node tests/browser_test.js
