# Builds the web app (ui/build.py) and publishes the site with GitHub Pages on every push to main
# (repo Settings -> Pages -> Source: "GitHub Actions"). ui/index.html is built here, not committed.
# The published app is encrypted behind the team passphrase (tools/encrypt_page.js): set it as the repository secret
# TEAM_PASSPHRASE (Settings -> Secrets and variables -> Actions). Without it the build stops rather than publish an
# open copy.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build the page (solver, schema, three.js, SheetJS and fonts built in)
        run: python3 ui/build.py
      - name: Assemble the site
        run: |
          mkdir -p _site/ui
          cp index.html _site/
          cp ui/guide.html _site/ui/
      - name: Encrypt the app behind the team passphrase
        env:
          TEAM_PASSPHRASE: ${{ secrets.TEAM_PASSPHRASE }}
        run: node tools/encrypt_page.js ui/index.html _site/ui/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
