[project]
name = "fsae-suspension-solver"
version = "1.1.0"
description = "Double-wishbone kinematics, ride, loads and whole-car balance for Formula SAE teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "jinja2==3.1.6"]

[project.optional-dependencies]
plots = ["matplotlib==3.11.2"]
dev = ["ruff==0.16.8", "cadquery-ocp"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# ruff's classic default rule set (pyflakes + the error-level pycodestyle rules), pinned here so a ruff upgrade
# doesn't change what CI checks
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["susp", "susp.loads", "susp.tools", "susp.output"]
py-modules = ["susp_solver"]

[tool.setuptools.package-data]
"susp.output" = ["templates/*.j2"]
