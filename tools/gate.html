<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wake Forest FSAE</title>
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(data:font/woff2;base64,/*FONT_B64*/) format("woff2"); }
:root { color-scheme: dark; --gold: #9e7e38; --gold-hi: #c9a85a; --black: #0b0b0b; --panel: #151515; --ink: #f2efe8; --muted: #a9a294; --line: #2e2a22; --bad: #ff9b8f; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--black) repeating-linear-gradient(135deg, transparent 0 22px, rgba(158,126,56,.06) 22px 23px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: 6px; background: var(--gold); }
form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--gold); border-radius: 4px; padding: 30px 28px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.eyebrow { margin: 0 0 6px; font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-hi); }
h1 { margin: 0; font: 600 38px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
.rule { width: 48px; height: 3px; background: var(--gold); margin: 14px 0 16px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
label { display: block; font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #3a352b; border-radius: 3px; background: #0e0e0e; color: var(--ink); }
input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
button { margin-top: 14px; width: 100%; padding: 11px; border: 0; border-radius: 3px; background: var(--gold); color: #0b0b0b; cursor: pointer;
  font: 600 18px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
button:hover { background: var(--gold-hi); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button:disabled { opacity: .65; cursor: wait; }
#msg { color: var(--bad); min-height: 1.3em; margin: 12px 0 0; font-size: 13px; }
.foot a { color: var(--gold-hi); }
.foot { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: #7d776b; }
</style>
</head>
<body>
<form id="gate" hidden>
  <p class="eyebrow">Vehicle Dynamics Workbench</p>
  <h1>Wake Forest FSAE</h1>
  <div class="rule"></div>
  <p>Enter the team passphrase here; your browser will remember next time you visit.</p>
  <label for="pass">Team passphrase</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Open</button>
  <p id="msg" role="alert"></p>
  <p class="foot">Team members only. Ask your team lead for the passphrase. Not on the team? <a href="../demo/">Try the demo</a>.</p>
</form>
<script>
(function () {
  "use strict";
  const P = /*PAYLOAD*/null;
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  };
  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: u8(P.salt), iterations: P.iter }, base, 256);
    const key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.ct));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    store.set("susp.teampass", pass);
    document.open();
    document.write(html);
    document.close();
  }
  const form = document.getElementById("gate"), msg = document.getElementById("msg"), go = document.getElementById("go");
  function ask(text) {
    form.hidden = false;
    msg.textContent = text || "";
    document.getElementById("pass").focus();
  }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    ask("This browser is not supported. Please use a current version of Chrome, Edge, Firefox or Safari.");
    go.disabled = true;
    return;
  }
  form.addEventListener("submit", e => {
    e.preventDefault();
    go.disabled = true;
    msg.textContent = "";
    go.textContent = "Opening…";
    open(document.getElementById("pass").value).catch(() => {
      go.disabled = false;
      go.textContent = "Open";
      msg.textContent = "Incorrect passphrase. Please try again.";
    });
  });
  const saved = store.get("susp.teampass");
  if (saved) open(saved).catch(() => ask("The team passphrase has changed. Please enter the new passphrase."));
  else ask();
})();
</script>
</body>
</html>
